# Builds the Mac (.dmg, Apple Silicon + Intel) and Windows (.exe) installers on GitHub's own
# Mac and Windows machines. Push a tag like v1.0.1 (or click "Run workflow") and download the
# installers from the run's Artifacts. Add signing secrets later to remove OS warnings.
name: Build installers
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci || npm install
      - run: npm test
      - name: Add Creator Hub's built-in sign-in (from repository secrets; never committed)
        shell: bash
        env:
          G_SECRET: ${{ secrets.CH_GOOGLE_CLIENT_SECRET }}
        run: |
          node -e "require('fs').writeFileSync('src/oauth/builtin.json', JSON.stringify({ google: { clientSecret: process.env.G_SECRET || '' } }))"
          node -e "const b=require('./src/oauth/builtin');if(!b.builtin('google')){console.error('Missing the CH_GOOGLE_CLIENT_SECRET repository secret: refusing to ship a build without one-click Google sign-in.');process.exit(1)}console.log('built-in Google sign-in: yes')"
      - name: Build (Mac)
        if: runner.os == 'macOS'
        # Ad-hoc signed (package.json mac.identity "-") until you add an Apple Developer ID.
        run: npx electron-builder --mac dmg --arm64 --x64 --publish never
      - name: Verify Mac signatures (fails the build if the app would crash on launch)
        if: runner.os == 'macOS'
        run: |
          set -e
          for dmg in dist/*.dmg; do
            mnt=$(mktemp -d)
            hdiutil attach "$dmg" -nobrowse -readonly -mountpoint "$mnt" >/dev/null
            codesign --verify --deep --strict --verbose=2 "$mnt/Creator Hub.app"
            hdiutil detach "$mnt" >/dev/null
          done
          # Launch smoke test of the native-arch build: app must stay alive for 8s
          app="dist/mac-arm64/Creator Hub.app"
          [ -d "$app" ] || app="dist/mac/Creator Hub.app"
          "$app/Contents/MacOS/Creator Hub" --no-sandbox & pid=$!
          sleep 8
          if kill -0 $pid 2>/dev/null; then echo "launch OK"; kill $pid; else echo "APP CRASHED ON LAUNCH"; exit 1; fi
      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: npx electron-builder --win nsis --x64 --publish never
        # Unsigned until you add a Windows code-signing certificate (CSC_LINK / CSC_KEY_PASSWORD secrets).
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ runner.os }}
          path: |
            dist/*.dmg
            dist/*.exe
  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with: { path: out, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          name: Creator Hub ${{ steps.v.outputs.version }}
          files: out/*
          make_latest: true
